name: Build Image
run-name: Build Image
on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master
permissions:
  contents: read
  packages: write

jobs:
    build:
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
            - name: Log in to the Container registry
              uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}
            - name: Get Bazel
              uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
              with:
                # Avoid downloading Bazel every time.
                bazelisk-cache: true
                # Store build cache per workflow.
                disk-cache: ${{ github.workflow }}
                # Share repository cache between workflows.
                repository-cache: true
            - name: Run Server Unit Tests
              run: bazelisk test //server/...
            - name: Build Image
              run: bazelisk build :bentekkie-mainframe_image_tarball
            - name: Push PR Preview Image to GHCR
              if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
              run: bazelisk run :bentekkie-mainframe_image_push_tag -- --tag "pr-${{ github.event.pull_request.number }}"
